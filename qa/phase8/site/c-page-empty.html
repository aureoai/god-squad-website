<!doctype html>
<html lang="en" class="no-js"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>God Squad — Phase 8 harness</title>
<link rel="stylesheet" href="assets/design-tokens.css">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/header.css">
<link rel="stylesheet" href="assets/component-container.css">
<link rel="stylesheet" href="assets/component-button.css">
<link rel="stylesheet" href="assets/component-pagination.css">
<link rel="stylesheet" href="assets/component-quantity.css">
<link rel="stylesheet" href="assets/component-cart-line.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script>window.Shopify = window.Shopify || {routes: {root: '/'}};</script>
<script src="assets/header.js" defer></script>
<script src="assets/cart.js" defer></script>
</head><body class="template-cart">
<a class="skip-link" href="#MainContent">Skip to content</a>
<div id="shopify-section-header" class="shopify-section"><header
  class="header surface-dark"
  data-header
  
><div class="header__inner container"><div class="header__cluster header__cluster--start">
      <button
        type="button"
        class="header__control header__menu-toggle"
        aria-expanded="false"
        aria-controls="MobileMenu"
        data-menu-toggle
      >
        <svg class="icon icon--menu " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3.75 6.5h16.5"/><path d="M3.75 12h16.5"/><path d="M3.75 17.5h16.5"/></svg>

        <span class="visually-hidden">Menu</span>
      </button>
    </div><div class="header__branding"><a
          class="header__logo-link"
          href="/"
          
        ><img class="header__logo" src="img/logo.png" srcset="img/logo.png 120w, img/logo.png 180w, img/logo.png 240w, img/logo.png 360w, img/logo.png 480w, img/logo.png 600w" sizes="(min-width: 1024px) 240px, 160px" width="500" height="500" style="--logo-height-desktop: 78px; --logo-height-mobile: 56px;" alt="God Squad">
        </a></div><nav class="header__nav" aria-label="Primary">
      <ul class="header__nav-list" role="list"><li class="header__nav-item">
              <a
                class="header__nav-link"
                href="/"
                
              >Home</a>
            </li><li class="header__nav-item">
              <a
                class="header__nav-link"
                href="/collections/all"
                
              >Shop</a>
            </li><li class="header__nav-item">
              <a
                class="header__nav-link"
                href="/#story"
                
              >Our Story</a>
            </li><li class="header__nav-item">
              <a
                class="header__nav-link"
                href="/#verse"
                
              >Verse</a>
            </li></ul>
    </nav><div class="header__cluster header__cluster--end"><a class="header__control" href="/search" data-search-trigger>
          <svg class="icon icon--search " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.25"/><path d="M15.6 15.6 20.5 20.5"/></svg>

          <span class="visually-hidden">Search</span>
        </a><shopify-account
          class="header__control header__account"
          menu="customer-account-main-menu"
        >
          <span class="header__account-avatar" slot="signed-out-avatar">
            <svg class="icon icon--account " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8.25" r="3.75"/><path d="M4.75 19.75a7.25 7.25 0 0 1 14.5 0"/></svg>

            <span class="visually-hidden">Account</span>
          </span>
        </shopify-account><a
          class="header__control header__cart"
          href="/cart"
          data-cart-bubble
          
        >
          <svg class="icon icon--cart " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5.5 7.75h13l-1.1 11.3a1.4 1.4 0 0 1-1.4 1.2H8a1.4 1.4 0 0 1-1.4-1.2Z"/><path d="M9 10V6.9a3 3 0 0 1 6 0V10"/></svg>

<span class="visually-hidden">Cart</span>
        </a></div>
  </div><div class="header__search" id="HeaderSearch" data-search-panel hidden>
    <form
      class="header__search-form"
      action="/search"
      method="get"
      role="search"
    >
      <label class="visually-hidden" for="HeaderSearchInput">
        Search the store
      </label>
      <input
        class="header__search-input"
        id="HeaderSearchInput"
        type="search"
        name="q"
        placeholder="Search the store…"
        data-search-input
      ><input type="hidden" name="type" value="product">
      <button type="submit" class="button button--primary header__search-submit">
        Search
      </button>
      <button type="button" class="header__control" data-search-close>
        <svg class="icon icon--close " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.4 6.4 17.6 17.6"/><path d="M17.6 6.4 6.4 17.6"/></svg>

        <span class="visually-hidden">Close search</span>
      </button>
    </form>
  </div><div class="header__panel" id="MobileMenu" data-menu-panel hidden>
    <div class="header__panel-header">
      <span class="header__panel-title">Menu</span>
      <button type="button" class="header__control" data-menu-close>
        <svg class="icon icon--close " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.4 6.4 17.6 17.6"/><path d="M17.6 6.4 6.4 17.6"/></svg>

        <span class="visually-hidden">Close menu</span>
      </button>
    </div>

    <nav class="header__panel-nav" aria-label="Main">
      <ul class="header__panel-list" role="list"><li>
              <a
                class="header__panel-link"
                href="/"
                
              >Home</a>
            </li><li>
              <a
                class="header__panel-link"
                href="/collections/all"
                
              >Shop</a>
            </li><li>
              <a
                class="header__panel-link"
                href="/#story"
                
              >Our Story</a>
            </li><li>
              <a
                class="header__panel-link"
                href="/#verse"
                
              >Verse</a>
            </li></ul>
    </nav></div>

  <div class="header__overlay" data-menu-overlay hidden></div>
</header>


</div>
<main id="MainContent" tabindex="-1">
<div id="shopify-section-main" class="shopify-section"><link rel="stylesheet" href="assets/section-main-cart.css">

<div
  class="main-cart surface-dark"
  data-cart-page
  data-cart-page-section="main"
  
>
  <div class="main-cart__inner container">
    <h1 class="main-cart__title" tabindex="-1" id="CartPageTitle">Your cart</h1><p class="main-cart__error" data-cart-error role="alert" hidden></p>

    <div data-cart-page-inner><div class="cart-empty">
  <p class="cart-empty__title">Your cart is empty.</p>
  <p class="cart-empty__body">Find something that speaks to your purpose.</p>
  <a class="button button--accent" href="/">
    Shop the collection
    <svg class="icon icon--arrow " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 12h15.5"/><path d="M13.5 6 19.5 12l-6 6"/></svg>

  </a>
</div>
</div>
  </div>
</div>


</div>
</main>

<div id="CartStatus" class="visually-hidden" role="status" aria-live="polite" data-cart-no-inert></div>
<div hidden data-cart-no-inert data-cart-strings
  data-added="Added to your cart."
  data-updated="Cart updated."
  data-removed="Removed from your cart."
  data-note-saved="Order note saved."
  data-quantity-announce="Quantity: [count]"
  data-error-generic="Unable to update your cart. Please try again."
  data-error-network="We could not reach the store. Check your connection and try again."></div>
</body></html>
